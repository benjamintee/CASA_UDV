<!DOCTYPE html>
<html>
<head>
<title>Real Time Air Quality Example for Multiple Cities</title>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />

<script charset="utf-8" src="https://d3js.org/d3.v7.min.js"></script>
    
    
<style>

    #pagecontent {
        width: 700px;
        margin: auto;
    }
    
    #airqualitytable {
        width: 400px;
        margin: auto;
        background-color: #ddd;
        margin-top: 30px;
    }
    
    #airqualitytable td {
        height: 50px;
    }

    #airqualitytable tr th {
        text-align: center;
        font: normal 12pt Verdana;
        height: 40px;
        color: #555;
        width: 200px;
    }    
    
    #airqualitytable tr td.PName {
        text-align: center;
        font: bold 14pt Verdana;
    }

    #airqualitytable tr td.PStatus {
        text-align: center;
        font: normal 12pt Verdana;
    }
    
    h1 {
        margin: 20px 0 0 0;
        font: bold 16pt Verdana;
    }
    
    p {
        margin: 5px 0 5px 0;
    }
        
    
</style>
</head>

<body>

<!--This is the div container for the chart-->

<div id="pagecontent">
    <h1 id="title">London Real Time Air Quality Data</h1>
    <p>Data provided by <a href="https://aqicn.org/data-platform/token/#/">AQICN Open Data Platform</a>.</p>
    
    <p><select id="CityMenu">
        <option>Change City Here:</option>
        <option value="bangalore">Bangalore</option>
        <option value="beijing">Beijing</option>
        <option value="istanbul">Istanbul</option>
        <option value="jakarta">Jakarta</option>
        <option value="london">London</option>
        <option value="newyork">New York City</option>
        <option value="paris">Paris</option>
        <option value="shanghai">Shanghai</option>
        <option value="sydney">Sydney</option>
        </select>
    </p>

    <table id="airqualitytable">
            <tr>
            <th>Pollutant</th>
            <th>Status</th>
            </tr>
            <tr>
                <td class="PName">PM2.5</td>
                <td class="PStatus" id="pm25">Data</td>
            </tr>
            <tr>
                <td class="PName">PM10</td>
                <td class="PStatus" id="pm10">Data</td>
            </tr>
            <tr>
                <td class="PName">O3</td>
                <td class="PStatus" id="o3">Data</td>
            </tr>
            <tr>
                <td class="PName">NO2</td>
                <td class="PStatus" id="no2">Data</td>
            </tr>
            <tr>
                <td class="PName">SO2</td>
                <td class="PStatus" id="so2">Data</td>
            </tr>
            <tr>
                <td class="PName">CO</td>
                <td class="PStatus" id="co">Data</td>
            </tr>

    </table>

</div>



<script>

// This time we create a more flexible function that inserts the pollution data according to the requested city

SetCityData = function(city) {
    
        var token = "065c9ad49f2ed519ebbd191cfc60a4b5e6dee4b7"
        var AQurl = "https://api.waqi.info/feed/" + city +"/?token=" + token;

              d3.json(AQurl).then(function(AQData) {

                console.log(AQData);

                document.getElementById("title").innerHTML= AQData.data.city.name + " Real Time Air Quality Data";

                setColor = function(value) {   
                    var color;        
                    if (value>=300){color="#7e0023";} else
                    if (value>=200){color="#660099";} else
                    if (value>=150){color="#cc0033";} else
                    if (value>=100){color="#ff9933";} else
                    if (value>=50){color="#ffde33";} else
                    if (value>0){color="#009966";} else
                    {color="#cccccc";} // Grey if no value found
                    return color;
                    }
                
                
                var pollutants = [
                    {"name": "pm25", "value": null},
                    {"name": "pm10", "value": null},
                    {"name": "o3", "value": null},
                    {"name": "no2", "value": null},
                    {"name": "so2", "value": null},
                    {"name": "co", "value": null}
                ];

                console.log(pollutants);

                pollutants.forEach(function(pollutant) {
 
                    var pollutantValue = AQData.data.iaqi[pollutant.name];
                    console.log(pollutantValue);
                    
                    if (pollutantValue) {   // Not all cities have all pollutants recorded. Only insert data if pollutant exists in AQData
                        pollutant.value = (pollutantValue.v); 
                    } else {pollutant.value = "NA"}

                    document.getElementById(pollutant.name).innerHTML = pollutant.value;   
                    var bgcolor = setColor(pollutant.value);       
                    document.getElementById(pollutant.name).style.backgroundColor = bgcolor;

                });


              });

    }


SetCityData("london"); //Default city value is London

    
 document.getElementById("CityMenu").onchange = function() {
        var city = document.getElementById("CityMenu").value;
        console.log(city);
        SetCityData(city);
 }    
 
    
</script>

</body>
</html>
