<!DOCTYPE html>
<html>
<head>
<title>Tfl Bike Share Docking Stations Real Time Map</title>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />

<link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

<script charset="utf-8" src="https://d3js.org/d3.v7.min.js"></script>
    

<style>

    body { margin: 0; padding: 0; }

    
    #title {
        position: absolute;
        background-color: #fff;
        box-shadow:0 1px 2px rgba(0, 0, 0, 0.20);
        border-radius: 3px;
        padding: 15px;
        margin-top: 15px;
        margin-left: 15px;
    }

    #title h2 {
        line-height: 24px;
        margin: 0;
    }

    #title p.credit {
       margin: 10px 0 0 0;
       padding: 0;
    }
    
	#map { position: absolute; top: 0; bottom: 0; width: 100%; };
    
</style>
</head>

<body>
    
    <div id="map"></div>
    
    <div id="title">
        <h2>London Bike Share Live Map</h2>
         <p class="credit">Data: <a href="https://api.tfl.gov.uk/">Transport for London API</a>.</p>
    </div>   
    


<script>
    

	mapboxgl.accessToken = 'pk.eyJ1IjoiZHVuY2FuMjAwMSIsImEiOiIyRDhtOE1nIn0.OA5QmCprkPbOoxZog8HIow';

        // Load a new map in the 'map' HTML div
        var map = new mapboxgl.Map({
            container: 'map', // container id
            style: 'mapbox://styles/mapbox/light-v10', // Using the standard Mapbox Light style
            center: [-0.1, 51.5], // starting position [lng, lat]
            zoom: 12 // starting zoom
        });
    
    
 map.on('load', function() {
    
    
            //This statement loads the JSON data for the TfL API, and then runs the function after the data is loaded. BikeData is a JSON array

                  d3.json("https://api.tfl.gov.uk/bikepoint").then(function(BikeData) {

                        //To map the data in Mapbox, it needs to be in GeoJSON format. Going to create new GeoJSON
                      
                      console.log(BikeData);
                      
                        var myGeojson = {};
                        myGeojson.type = 'FeatureCollection'; //Specify type is feature collection
                        myGeojson.features = []; //Create features array

                          var i;
                          for (i = 0; i < BikeData.length; i++) { //Loop through all docking stations
                              
                              var NbBikes = parseFloat(BikeData[i].additionalProperties[6].value);
                              var NbEmptyDocks = parseFloat(BikeData[i].additionalProperties[7].value);
                              var NbTotalDocks = parseFloat(BikeData[i].additionalProperties[8].value);
                              var PropFull = NbBikes/(NbBikes+NbEmptyDocks);
                              
                                  var newFeature = { //Create each docking station feature as JSON object
                                        "type": "Feature",
                                        "geometry": {
                                          "type": "Point",
                                          "coordinates": [BikeData[i].lon, BikeData[i].lat]
                                        },
                                        "properties": {
                                          "NbBikes": NbBikes,
                                          "NbEmptyDocks": NbEmptyDocks,
                                          "NbTotalDocks": NbTotalDocks,
                                          "PropFull": PropFull
                                        }
                                  }
                                  myGeojson.features.push(newFeature); //Add the new feature to the features array
                                }


                      console.log(myGeojson);
                      
                      map.addSource('points', { //Add the geojson to the map. Same syntax as earlier tube station proportional circles example
                            'type': 'geojson',
                            'data': myGeojson
                            });
                      
                      map.addLayer({
                            id: 'BikeStations',
                            type: 'circle',
                            source: 'points',
                            'layout': {
                                'visibility': 'visible'
                            },
                            paint: {
                                'circle-color':{
                                    property: 'PropFull',
                                    stops: [
                                        [0, "#00f"],
                                        [1, "#f00"],
                                        ]
                                },
                                'circle-opacity': 0.6,
                                'circle-stroke-width': 0.1,
                                'circle-stroke-color': '#999',
                                'circle-stroke-opacity': 1,
                                'circle-radius': {
                                    property: 'NbTotalDocks',
                                    stops: [
                                        [{zoom: 9, value: 0}, 0.1],
                                        [{zoom: 9, value: 40}, 2],
                                        [{zoom: 12, value: 0}, 3],
                                        [{zoom: 12, value: 40}, 15],
                                        [{zoom: 16, value: 0}, 4],
                                        [{zoom: 16, value: 40}, 60],
                                        ]
                                }}
                          });

                
                    });


 });


</script>

</body>
</html>
