<!DOCTYPE html>
<html>
  <head>
    <!--AFrame version 1.7.0-->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!--Orbit Control version 1.3.2-->
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
</head>

    <body>
    <a-scene>
        <a-asset>
            <img id="sky" src="./UCLquad.webp">
            <a-asset-item id="table" src="./table.glb"></a-asset-item>
        </a-asset>

        <a-sky radius="1.6" src="#sky"></a-sky>
    </a-scene>

    <a-entity id="containerexp" position="0 0 0" scale="1 1 1">
    <a-entity id="_table" gltf-model="#table" position="0 -1.6 0"></a-entity>
    </a-entity>

    <a-entity id="user" 
        camera 
        look-controls="enabled:false"
        orbit-controls="
        dampingFactor:0.1;  
        target: 0 0 0;  
        minDistance: 0.5;  
        maxDistance: 1;  
        initialPosition: 0.5 0.5 0.5; 
        rotateSpeed:0.5">
    </a-entity>


  </body>
</html>
