<!DOCTYPE html>
<html lang="en">
<head>
    <title>PMTiles source and protocol example using MapLibre</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js'></script>
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>

    // add the PMTiles plugin to the maplibregl global.
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    const PMTILES_URL = 'WorldBorders.pmtiles';

    const map = new maplibregl.Map({
        container: 'map',
        zoom: 1,
        center: [0,0],
        style: {
            version: 8,
            sources: {
                'example_source': {
                    type: 'vector',
                    url: `pmtiles://${PMTILES_URL}`
                }
            },
            layers: [
                {
                    'id': 'borders',
                    'source': 'example_source',
                    'source-layer': 'WorldBorders',
                    'type': 'fill',
                    'paint': {
                        'fill-color': 'steelblue',
                        'fill-outline-color': '#444', 
                    }
                }
            ]
        }
    });

    map.addControl(new maplibregl.NavigationControl({
        visualizePitch: false,
        visualizeRoll: false,
        showZoom: true,
        showCompass: true
    }));


</script>
</body>
</html>
